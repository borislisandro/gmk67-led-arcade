[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gmk67-led-arcade"
version = "0.1.0"
description = "Games you play on your keyboard's RGB lighting (Zuoya GMK67, OpenRGB, terminal simulator)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ledarcade = "ledarcade.__main__:main"

[tool.setuptools.packages.find]
include = ["ledarcade*"]
